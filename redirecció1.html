<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Felip - Loading...</title>
    <link rel="icon" type="image/png" href="/inici/assets/png/favicon.png">
    <style>
        body {
            background: #0a0a0a;
            color: #2ecc71;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Efecte d'encesa de pantalla (CRT Turn-on) */
        .screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: turn-on 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes turn-on {
            0% {
                transform: scale(1, 0.005);
                filter: brightness(30);
                opacity: 0;
            }
            50% {
                transform: scale(1, 0.005);
                opacity: 1;
            }
            100% {
                transform: scale(1, 1);
                filter: brightness(1);
                opacity: 1;
            }
        }

        /* Efecte de línies de TV antiga */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-shadow: 0 0 5px #2ecc71;
            animation: flicker 0.15s infinite;
            text-align: left;
        }

        .text-line {
            overflow: hidden;
            white-space: nowrap;
            margin: 0;
            border-right: .15em solid #2ecc71;
            width: 0;
            animation: typing 1.5s steps(30, end) forwards, blink-caret .75s step-end infinite;
        }

        .line-2 { animation-delay: 1.5s; width: 0; }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #2ecc71; }
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        /* Efecte de curvatura de pantalla */
        .crt {
            width: 100%;
            height: 100%;
            position: absolute;
            background: radial-gradient(circle, rgba(18, 16, 16, 0) 0%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="screen-wrapper">
        <div class="crt"></div>
        <div class="container">
            <p class="text-line">C:\> BOOTING SYSTEM...</p>
            <p class="text-line line-2">REDURECCIONANT A /INICI...</p>
        </div>
    </div>

    <script>
        // Redirecció després de 3.5 segons per deixar veure l'animació
        setTimeout(function() {
            window.location.href = "./inici/index.html";
        }, 3500);
    </script>
</body>
</html>
